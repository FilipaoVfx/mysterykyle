<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aquí no hay nada — Isa te amo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Great+Vibes&family=Jost:wght@300;500&display=swap">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100svh; display:grid; place-items:center; text-align:center;
    padding-left:max(18px, env(safe-area-inset-left,0px));
    padding-right:max(18px, env(safe-area-inset-right,0px));
    padding-block:40px;
    background:repeating-linear-gradient(90deg,#fde8ee 0 14px,#f9d2de 14px 28px);
    color:#4a1224; font-family:"Jost","Avenir Next",system-ui,sans-serif; font-weight:300;
  }
  img{width:min(42vw,150px); filter:drop-shadow(0 14px 30px rgba(141,15,49,.3)); animation:beat 2.4s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}26%{transform:scale(1.02)}}
  h1{font-family:"Archivo Black",sans-serif; font-size:clamp(28px,9vw,54px); margin:22px 0 4px; line-height:1}
  p{margin:0; color:#8a4c5f}
  .vuelve{font-family:"Great Vibes",cursive; font-size:clamp(34px,11vw,54px); color:#d31a46; text-decoration:none; display:inline-block; margin-top:20px}
  .vuelve:hover{text-decoration:underline}
  @media (prefers-reduced-motion:reduce){img{animation:none}}
</style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="" width="150" height="138">
    <h1>POR AQUÍ NO</h1>
    <p>Esta página no existe, pero lo otro sí.</p>
    <a class="vuelve" href="/">volver al corazón</a>
  </main>
</body>
</html>
